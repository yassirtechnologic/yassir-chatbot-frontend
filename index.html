<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Yassir – Chatbot Eventos York & Katy</title>

  <link rel="stylesheet" href="styles/colors.css" />
  <link rel="stylesheet" href="styles/chat.css" />
</head>

<body>

  <!-- Chat -->
  <div id="chat-overlay">
    <div id="chat-window">
      <div id="chat-header">
        Eventos York & Katy
        <button onclick="closeChat()">✖</button>
      </div>

      <div id="messages"></div>

      <div id="chat-input">
        <input id="prompt" placeholder="Escribe tu mensaje..." />
        <button onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
